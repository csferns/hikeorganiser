name: Deploy Frontend (Azure Static Web Apps)

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy_infra:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Azure login
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Ensure resource group
        run: az group create --name "${{ vars.AZURE_RESOURCE_GROUP }}" --location "${{ vars.AZURE_LOCATION }}"

      - name: Deploy infrastructure
        run: az deployment group create --resource-group "${{ vars.AZURE_RESOURCE_GROUP }}" --template-file pipeline/main.bicep

  build_and_deploy:
    needs: deploy_infra
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20.x"
          cache: npm
          cache-dependency-path: src/vite-project/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: src/vite-project

      - name: Build
        run: npm run build
        working-directory: src/vite-project

      - name: Deploy
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          action: upload
          app_location: src/vite-project
          output_location: dist
          skip_app_build: true
          api_location: ""
